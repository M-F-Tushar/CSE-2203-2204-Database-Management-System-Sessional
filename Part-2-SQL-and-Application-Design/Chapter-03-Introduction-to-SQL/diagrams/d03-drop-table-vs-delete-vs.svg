goe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">+ its SCHEMA entirely.</text><text x="158.50991821289062" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Table no longer exists.</text></g><g stroke-linecap="round" transform="translate(181.66387939453125 296) rotate(0 185 66)"><path d="M0.32 -0.2 L371 -1.08 L371.18 133.35 L1.48 131.7" stroke="none" stroke-width="0" fill="#ffd97d"></path><path d="M0 0 C110.11 -0.2, 217.88 -0.42, 370 0 M0 0 C123.81 -1.01, 248.23 -0.28, 370 0 M370 0 C370.78 36.03, 371.1 74.97, 370 132 M370 0 C367.91 30.14, 369.2 59.88, 370 132 M370 132 C238.03 130.33, 107.25 130.18, 0 132 M370 132 C257.13 132.54, 144.93 132.24, 0 132 M0 132 C-1.44 84.24, 0.49 32.53, 0 0 M0 132 C0.73 88.77, -0.1 46.11, 0 0" stroke="#e8a33d" stroke-width="2" fill="none"></path></g><g transform="translate(210.4939727783203 312) rotate(0 156.16990661621094 50)"><text x="156.16990661621094" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a4a00" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">delete from r</text><text x="156.16990661621094" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a4a00" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Removes only the ROWS (data).</text><text x="156.16990661621094" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a4a00" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The empty table/schema</text><text x="156.16990661621094" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a4a00" text-anchor="middle" style="white-space: