nt, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#14532d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Runs inside the query process but</text><text x="166.06988525390625" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#14532d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">restricted to its own memory —</text><text x="166.06988525390625" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#14532d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">best of both worlds</text></g><g stroke-linecap="round"><g transform="translate(620 148.5) rotate(0 -209.5 43)"><path d="M-0.14 0.77 C-0.43 8.34, 69.36 37.37, -0.65 44.55 C-70.65 51.74, -350.37 36.96, -420.18 43.87 C-489.99 50.78, -419.7 79.06, -419.51 86.02 M-1.67 0.13 C-1.67 7.46, 71.1 36.05, 1.73 42.99 C-67.64 49.92, -347.7 34.37, -417.91 41.73 C-488.12 49.08, -419.09 79.78, -419.53 87.14" stroke="#3c4043" stroke-width="1.5" fill="none"></path></g><g transform="translate(620 148.5) rotate(0 -209.5 43)"><path d="M-439.16 79.01 C-430.2 81.16, -421.99 83.47, -419.53 87.14 M-439.16 79.01 C-432.71 81.41, -427.19 84, -419.53 87.14" stroke="#3c4043" stroke-width="1.5" fill="none"></path></g><g transform="translate(620 148.5) rotate(0 -209.5 43)"><path d="M-429.34 68.29 C-424.33 74.65, -419.99 81.18, -419.53 87.14 M-429.34 68.29 C-426.19 74.25, -423.92 80.39, -419.53 87.14" stroke="#3c4043" stroke-width="1.5" fill="none"></path></g></g><mask></mask><g stroke-linecap="round"><g transform="translate(619.5 148.5) rotate(0 -0.5 30.5)"><path d="M0 0 C-1.37 15.63, -2.49 28.37, -1 61 M0 0 C-0.53 14.72, -0.89 30.9, -1 61" stroke="#3c4043" stroke-width="1.5" fill="none"></path></g><g transform="translate(619.5 148.5) rotate(0 -0.5 30.5)"><path d="M-9.39 37.45 C-8.58 44.51, -7.57 48.73, -1 61 M-9.39 37.45 C-7.5 42.52, -5.44 49.05,