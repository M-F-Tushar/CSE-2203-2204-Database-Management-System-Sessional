d" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">full design)</text></g><g stroke-linecap="round" transform="translate(116.96987915039062 514) rotate(0 192 53.5)"><path d="M1.93 0.18 L383.91 -1.77 L383.42 108.26 L1.05 108.26" stroke="none" stroke-width="0" fill="#ffc2c2"></path><path d="M0 0 C95.48 -0.68, 192.31 -1.07, 384 0 M0 0 C128.42 0.61, 257.24 -0.04, 384 0 M384 0 C384.69 25.62, 384.47 47.22, 384 107 M384 0 C383.85 29.86, 384.7 60.34, 384 107 M384 107 C251.82 105.34, 118.15 105.44, 0 107 M384 107 C300.97 108.26, 219.23 108.16, 0 107 M0 107 C1.15 84.11, 0.4 58.2, 0 0 M0 107 C-0.25 78.02, -0.06 48.83, 0 0" stroke="#e05252" stroke-width="2" fill="none"></path></g><g transform="translate(150.510009765625 530) rotate(0 158.45986938476562 37.5)"><text x="158.45986938476562" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3. Physical Level (Internal Level)</text><text x="158.45986938476562" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">How data is actually stored on</text><text x="158.45986938476562" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">disk — bytes, files, indexes</text></g><g stroke-linecap="round"><g transform="translate(308.9698791503906 258.5) rotate(0 0 30.5)"><path d="M0 0 C0.78 13.75, 0.11 28.99, 0 61 M0 0 C0.05 15.9, -1.03 32.65, 0 61" stroke="#3c4043" stroke-width="1.5" fill="none"></path></g><g transform="translate(308.9698791503906 258.5) rotate(0 0 30.5)"><path d="M-9.01 37.68 C-6.3 42.75, -4.88 49.26, 0 61 M-9.01 37.68 C-6.41 43.34, -5.03 49.77, 0 61" stroke="#3c4043" stroke