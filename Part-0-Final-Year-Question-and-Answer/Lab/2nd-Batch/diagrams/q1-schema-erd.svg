<text x="30" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">Solid arrows: foreign keys (child -&gt; parent). Dashed arrow: Salary.Emp_ID matches Employee.Emp_ID by value only (no FK declared).</text>
<text x="30" y="712" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">Employee has no primary key on purpose, so an exact duplicate row can exist (question b).</text>
<text x="30" y="734" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">Salary has no primary key: one employee can have several salary records (question d).</text>
