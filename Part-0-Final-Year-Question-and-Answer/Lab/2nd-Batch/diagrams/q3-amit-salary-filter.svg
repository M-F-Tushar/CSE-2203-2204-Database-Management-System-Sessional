<line x1="200" y1="174" x2="200.0" y2="216.0" stroke="#555" stroke-width="2"/><polygon points="200,226 195.0,216.0 205.0,216.0" fill="#555"/><text x="212" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">WHERE e.Emp_Name = 'AMIT' AND s.Salary &gt; 50000</text>
