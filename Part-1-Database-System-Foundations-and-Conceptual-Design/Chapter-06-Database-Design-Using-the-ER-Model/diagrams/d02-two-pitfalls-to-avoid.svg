ransform="translate(36.39013671875 239) rotate(0 164.10986328125 62.5)"><text x="164.10986328125" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Redundancy</text><text x="164.10986328125" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The same fact is stored in more</text><text x="164.10986328125" y="67.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">than one place unnecessarily</text><text x="164.10986328125" y="92.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(e.g., storing a course's title with</text><text x="164.10986328125" y="117.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#7a1a1a" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">every section offering)</text></g><g stroke-linecap="round" transform="translate(437 210) rotate(0 182 91)"><path d="M-1.23 -1.73 L362.86 0.3 L364.03 183.46 L1.47 181.03" stroke="none" stroke-width="0" fill="#ffd97d"></path><path d="M0 0 C125.38 0.78, 250.99 -1.1, 364 0 M0 0 C95.37 -0.55, 189.64 -0.3, 364 0 M364 0 C362.18 50.09, 364.05 98.79, 364 182 M364 0 C364.21 44.11, 363.91 89.56, 364 182 M364 182 C263.93 184.04, 162.56 183.63, 0 182 M364 182 C231.7 181.49, 99.45 181.9, 0 182 M0 182 C-0.3 141.56, -0.3 99.07, 0 0 M0 182 C0.95 131.38, 1.11 79.99, 0 0" stroke="#e8a33d" stroke-width="2" fill="none"></path></g><g transform="translate(463.4400939941406 226) rotate(0 155.55990600585938 75)"><text x="155.5599060058